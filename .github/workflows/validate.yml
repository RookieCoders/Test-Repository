name: CPU validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/audit.py --notebook --output results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-audit
          path: |
            results/ci/**/*.json
            results/ci/**/*.xml
            results/ci/**/*.log
            results/ci/**/*.csv
            results/ci/**/*.ipynb
